# linuxserver/plex on puck. Host networking keeps clients on 192.168.1.8:32400.
# Media bind-mounts keep the native library paths so metadata does not need remapping.
#
# qBittorrent shares Gluetun's network namespace (Proton VPN kill switch).
# If the tunnel is down, qBittorrent has no network. Do not publish torrent
# ports on the LAN; peers come in through Proton port forwarding.
#
# plex-qbit throttles qBittorrent while Plex is streaming (alt speed limits).
# qbit-organize files finished torrents into TV/Movies, names them for Plex, and
# drops them from seeding. plex-chat is host-networked like Plex (localhost + LAN :7680).
# imdb-daily picks 3 IMDb Top 250 movies between midnight and 6am and queues them in qBit.
# Grafana + VictoriaMetrics + VictoriaLogs replace Elastic/Kibana (LAN :3000).
# Admin UIs bind LAN_IP only (not 0.0.0.0 / [::]). Images are pinned by digest.
services:
  plex:
    image: lscr.io/linuxserver/plex:latest@sha256:1f6f97d76e7bdb013789e94c838f2d9133b01ee4b2d4194148e492c4e4f12d90
    container_name: plex
    network_mode: host
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      VERSION: ${VERSION}
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${PLEX_CONFIG}:/config
      - /mnt/usbdrive/TV:/mnt/usbdrive/TV
      - /mnt/usbdrive/Movies:/mnt/usbdrive/Movies
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  gluetun:
    image: qmcgaw/gluetun:v3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - ${LAN_IP}:${QBIT_WEBUI_PORT}:${QBIT_WEBUI_PORT}
      - 127.0.0.1:8000:8000
      - 127.0.0.1:18081:18081
    volumes:
      - ${GLUETUN_CONFIG}:/gluetun
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - proton.env
    environment:
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      SERVER_COUNTRIES: Switzerland
      PORT_FORWARD_ONLY: "on"
      VPN_PORT_FORWARDING: "on"
      FIREWALL_INPUT_PORTS: ${QBIT_WEBUI_PORT},8000,18081
      FIREWALL_OUTBOUND_SUBNETS: 192.168.1.0/24,10.127.1.0/24,172.16.0.0/12
      HTTP_CONTROL_SERVER_ADDRESS: ":8000"
      HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH: /gluetun/auth/config.toml
      TZ: ${TZ}
      VPN_PORT_FORWARDING_UP_COMMAND: /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences'
      VPN_PORT_FORWARDING_DOWN_COMMAND: /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8080/api/v2/app/setPreferences'
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest@sha256:304b19cf94bf4fda534e0b086cab9c5f1a9e139a8180c05c0ad7d2ba1526fa99
    container_name: qbittorrent
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: ${QBIT_PUID}
      PGID: ${QBIT_PGID}
      TZ: ${TZ}
      WEBUI_PORT: ${QBIT_WEBUI_PORT}
      TORRENTING_PORT: ${QBIT_TORRENTING_PORT}
    volumes:
      - ${QBIT_CONFIG}:/config
      - ${QBIT_DOWNLOADS}:/downloads
      # Same disk at the host path so WebUI "save to /mnt/usbdrive/Downloads" works.
      - ${QBIT_DOWNLOADS}:/mnt/usbdrive/Downloads
      # Category save paths (TV / Movies) must exist inside this container.
      - /mnt/usbdrive/TV:/mnt/usbdrive/TV
      - /mnt/usbdrive/Movies:/mnt/usbdrive/Movies
    stop_grace_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Throttle qBittorrent (alt speed limits) while Plex is streaming.
  # Poller is host-networked (Plex is not reachable from the compose bridge).
  # Apply shares Gluetun so the qBit API is localhost.
  plex-qbit:
    image: python:3.12-alpine
    container_name: plex-qbit
    network_mode: host
    command: ["python", "-u", "/app/plex_qbit.py"]
    environment:
      ROLE: poller
      PLEX_URL: http://127.0.0.1:32400
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      PLEX_PREFS: /prefs.xml
      STATE_PATH: /var/lib/plex-qbit/state.json
      TZ: ${TZ}
      INTERVAL_SEC: "10"
      THROTTLE_ON: ${PLEX_QBIT_THROTTLE_ON:-wan}
    volumes:
      - ./helpers/plex_qbit.py:/app/plex_qbit.py:ro
      - ${PLEX_CONFIG}/Library/Application Support/Plex Media Server/Preferences.xml:/prefs.xml:ro
      - ${PLEX_QBIT_DATA}:/var/lib/plex-qbit
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  plex-qbit-apply:
    image: python:3.12-alpine
    container_name: plex-qbit-apply
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
      qbittorrent:
        condition: service_started
    command: ["python", "-u", "/app/plex_qbit.py"]
    environment:
      ROLE: apply
      QBIT_URL: http://127.0.0.1:${QBIT_WEBUI_PORT}
      QBIT_USER: ${QBIT_USER:-}
      QBIT_PASS: ${QBIT_PASS:-}
      STATE_PATH: /var/lib/plex-qbit/state.json
      TZ: ${TZ}
      INTERVAL_SEC: "10"
    volumes:
      - ./helpers/plex_qbit.py:/app/plex_qbit.py:ro
      - ${PLEX_QBIT_DATA}:/var/lib/plex-qbit
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  qbit-organize:
    image: python:3.12-alpine
    container_name: qbit-organize
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
      qbittorrent:
        condition: service_started
    command: ["python", "-u", "/app/qbit_organize.py"]
    environment:
      ROLE: organize
      QBIT_URL: http://127.0.0.1:${QBIT_WEBUI_PORT}
      QBIT_USER: ${QBIT_USER:-}
      QBIT_PASS: ${QBIT_PASS:-}
      TV_DIR: /mnt/usbdrive/TV
      MOVIE_DIR: /mnt/usbdrive/Movies
      STATE_PATH: /var/lib/qbit-organize/state.json
      MOVE_UID: ${QBIT_PUID}
      MOVE_GID: ${QBIT_PGID}
      TZ: ${TZ}
      INTERVAL_SEC: "20"
      COMPLETION_GRACE_SEC: "20"
    volumes:
      - ./helpers/qbit_organize.py:/app/qbit_organize.py:ro
      - ${QBIT_ORGANIZE_DATA}:/var/lib/qbit-organize
      - ${QBIT_DOWNLOADS}:/downloads
      - ${QBIT_DOWNLOADS}:/mnt/usbdrive/Downloads
      - /mnt/usbdrive/TV:/mnt/usbdrive/TV
      - /mnt/usbdrive/Movies:/mnt/usbdrive/Movies
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  qbit-organize-scan:
    image: python:3.12-alpine
    container_name: qbit-organize-scan
    network_mode: host
    command: ["python", "-u", "/app/qbit_organize.py"]
    environment:
      ROLE: scan
      PLEX_URL: http://127.0.0.1:32400
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      PLEX_PREFS: /prefs.xml
      STATE_PATH: /var/lib/qbit-organize/state.json
      TZ: ${TZ}
      INTERVAL_SEC: "300"
    volumes:
      - ./helpers/qbit_organize.py:/app/qbit_organize.py:ro
      - ${PLEX_CONFIG}/Library/Application Support/Plex Media Server/Preferences.xml:/prefs.xml:ro
      - ${QBIT_ORGANIZE_DATA}:/var/lib/qbit-organize
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  qbit-bridge:
    image: puck-plex-chat:local
    container_name: qbit-bridge
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
      qbittorrent:
        condition: service_started
    command: ["python", "-u", "/app/bridge.py"]
    environment:
      QBIT_UPSTREAM: http://127.0.0.1:${QBIT_WEBUI_PORT}
      BRIDGE_PORT: "18081"
      NOVA_DIR: /nova3
      TZ: ${TZ}
    volumes:
      - ./plex-chat/bridge.py:/app/bridge.py:ro
      - ${QBIT_CONFIG}/qBittorrent/nova3:/nova3:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:0.32.9
    container_name: ollama
    environment:
      TZ: ${TZ}
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ${OLLAMA_DATA}:/root/.ollama
    ports:
      - 127.0.0.1:11434:11434
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  ollama-pull:
    image: ollama/ollama:0.32.9
    container_name: ollama-pull
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
    entrypoint: ["sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull \"$$OLLAMA_MODEL\""]
    restart: "no"

  plex-chat:
    build: ./plex-chat
    image: puck-plex-chat:local
    container_name: plex-chat
    network_mode: host
    depends_on:
      qbit-bridge:
        condition: service_started
      ollama:
        condition: service_started
    environment:
      QBIT_URL: http://127.0.0.1:18081
      OLLAMA_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      PLEX_URL: http://127.0.0.1:32400
      GLUETUN_CTRL: http://127.0.0.1:8000
      PORT: ${PLEX_CHAT_PORT}
      TZ: ${TZ}
      QBIT_SAVE_HOST: ${QBIT_DOWNLOADS}
      TV_DIR: /tv
      MOVIE_DIR: /movies
      IMDB_DATA_DIR: /var/lib/imdb-daily
      PLEX_CHAT_USER: ${PLEX_CHAT_USER}
      PLEX_CHAT_PASSWORD: ${PLEX_CHAT_PASSWORD}
      MAX_TORRENT_GIB: ${MAX_TORRENT_GIB:-20}
      QBIT_ORGANIZE_STATE: /var/lib/qbit-organize/state.json
      HOST_PROC: /host/proc
      HOST_ROOT: /host-root
      HOST_USB: /tv
    volumes:
      - ./plex-chat/app.py:/app/app.py:ro
      - ./plex-chat/static:/app/static:ro
      - ${PLEX_QBIT_DATA}:/var/lib/plex-qbit:ro
      - ${QBIT_ORGANIZE_DATA}:/var/lib/qbit-organize:ro
      - /mnt/usbdrive/TV:/tv:ro
      - /mnt/usbdrive/Movies:/movies:ro
      - ${IMDB_DAILY_DATA:-/home/klg/imdb-daily}:/var/lib/imdb-daily:ro
      - /proc:/host/proc:ro
      - /home/klg:/host-root:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  imdb-daily:
    image: puck-plex-chat:local
    container_name: imdb-daily
    network_mode: host
    depends_on:
      qbit-bridge:
        condition: service_started
    command: ["python", "-u", "/app/imdb_daily.py"]
    environment:
      QBIT_URL: http://127.0.0.1:18081
      MOVIE_DIR: /movies
      TV_DIR: /tv
      IMDB_DAILY_STATE: /var/lib/imdb-daily/state.json
      IMDB_DAILY_COUNT: "3"
      MAX_TORRENT_GIB: ${MAX_TORRENT_GIB:-20}
      TZ: ${TZ}
    volumes:
      - ./plex-chat/app.py:/app/app.py:ro
      - ./plex-chat/imdb_daily.py:/app/imdb_daily.py:ro
      - /mnt/usbdrive/Movies:/movies:ro
      - /mnt/usbdrive/TV:/tv:ro
      - ${IMDB_DAILY_DATA:-/home/klg/imdb-daily}:/var/lib/imdb-daily
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      PUID: ${QBIT_PUID}
      PGID: ${QBIT_PGID}
      TZ: ${TZ}
      SONARR__AUTH__METHOD: External
      SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
    volumes:
      - ${SONARR_CONFIG}:/config
      - /mnt/usbdrive/TV:/tv
    ports:
      - ${LAN_IP}:8989:8989
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      PUID: ${QBIT_PUID}
      PGID: ${QBIT_PGID}
      TZ: ${TZ}
      RADARR__AUTH__METHOD: External
      RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
    volumes:
      - ${RADARR_CONFIG}:/config
      - /mnt/usbdrive/Movies:/movies
    ports:
      - ${LAN_IP}:7878:7878
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    depends_on:
      - sonarr
      - radarr
    environment:
      PUID: ${QBIT_PUID}
      PGID: ${QBIT_PGID}
      TZ: ${TZ}
    volumes:
      - ${BAZARR_CONFIG}:/config
      - /mnt/usbdrive/TV:/tv
      - /mnt/usbdrive/Movies:/movies
    ports:
      - ${LAN_IP}:6767:6767
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  ntfy:
    image: binwiederhier/ntfy:v2.14.0@sha256:5a051798d14138c3ecb12c038652558ab6a077e1aceeb867c151cbf5fa8451ef
    container_name: ntfy
    command: ["serve"]
    environment:
      TZ: ${TZ}
    volumes:
      - ${NTFY_DATA}:/var/lib/ntfy
      - ${NTFY_DATA}/server.yml:/etc/ntfy/server.yml:ro
    ports:
      - ${LAN_IP}:2586:443
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.151.0@sha256:6d164540a04f49ba4e696cbdb70f9fee78be1e94b8f2a1292743a0b1ab8275bd
    container_name: victoriametrics
    command:
      - --storageDataPath=/victoria-metrics-data
      - --retentionPeriod=90d
      - --httpListenAddr=:8428
      - --memory.allowedBytes=512MB
    mem_limit: 768m
    volumes:
      - ${VM_DATA}:/victoria-metrics-data
    ports:
      - ${LAN_IP}:8428:8428
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  victorialogs:
    image: victoriametrics/victoria-logs:v1.51.1@sha256:a3ecc79c2a1f3ea3b03ac517dcf45c8f6ecbd65629acfd9140c335e867b13522
    container_name: victorialogs
    command:
      - --storageDataPath=/vlogs
      - --retentionPeriod=90d
      - --httpListenAddr=:9428
      - --memory.allowedBytes=256MB
    mem_limit: 512m
    volumes:
      - ${VL_DATA}:/vlogs
    ports:
      - ${LAN_IP}:9428:9428
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:12.3.1@sha256:2175aaa91c96733d86d31cf270d5310b278654b03f5718c59de12a865380a31f
    container_name: grafana
    depends_on:
      - victoriametrics
      - victorialogs
    environment:
      TZ: ${TZ}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL: victoriametrics-logs-datasource
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource
      GF_SERVER_ROOT_URL: http://${LAN_IP}:3000
    volumes:
      - ${GRAFANA_DATA}:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - ${LAN_IP}:3000:3000
    mem_limit: 512m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  alloy:
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    container_name: alloy
    user: "0:0"
    depends_on:
      - victoriametrics
      - victorialogs
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - ${ALLOY_DATA}:/var/lib/alloy
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /sys:/sys:ro
      - /:/host/root:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /var/log:/var/log:ro
      - ${PLEX_CONFIG}/Library/Application Support/Plex Media Server/Logs:/plex-logs:ro
      - ${BAZARR_CONFIG}/log:/bazarr-logs:ro
    ports:
      - 127.0.0.1:12345:12345
    mem_limit: 384m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  puck-metrics:
    image: python:3.12-alpine
    container_name: puck-metrics
    network_mode: host
    depends_on:
      - victoriametrics
      - victorialogs
    command: ["python", "-u", "/app/puck_metrics.py"]
    environment:
      PLEX_URL: http://127.0.0.1:32400
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      PLEX_PREFS: /prefs.xml
      VM_URL: http://${LAN_IP}:8428
      VL_URL: http://${LAN_IP}:9428
      GLUETUN_URL: http://127.0.0.1:8000
      GLUETUN_CONTROL_USER: ${GLUETUN_CONTROL_USER:-}
      GLUETUN_CONTROL_PASSWORD: ${GLUETUN_CONTROL_PASSWORD:-}
      GLUETUN_AUTH_FILE: /gluetun-auth.toml
      TZ: ${TZ}
      INTERVAL_SEC: "30"
    volumes:
      - ./helpers/puck_metrics.py:/app/puck_metrics.py:ro
      - ${PLEX_CONFIG}/Library/Application Support/Plex Media Server/Preferences.xml:/prefs.xml:ro
      - ${GLUETUN_CONFIG}/auth/config.toml:/gluetun-auth.toml:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
